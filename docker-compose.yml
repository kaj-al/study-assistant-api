services:
  db:
    image: postgres:16-alpine
    container_name: nexora-db
    restart: always
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexdev}
    ports:
      - "5433:5432"
    volumes:
      - nexora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: nexora-api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD:-nexdev}@db:5432/nexora
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  nexora_postgres_data:
